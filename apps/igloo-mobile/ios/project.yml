name: IglooMobile
options:
  bundleIdPrefix: com.frostr.igloo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.frostr.igloo
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
  configs:
    Debug:
      PRODUCT_BUNDLE_IDENTIFIER: com.frostr.igloo.dev

targets:
  IglooMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Bindings
        excludes:
          - "*.h"
          - "*.modulemap"
      - path: Resources/Fonts
        type: folder
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: IglooMobile.entitlements
    dependencies:
      - framework: Frameworks/IglooMobileCore.xcframework
        embed: false

  IglooMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IglooMobileUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frostr.igloo.dev.ui-tests
        INFOPLIST_FILE: IglooMobileUITests/Info.plist
        TEST_TARGET_NAME: IglooMobile
    dependencies:
      - target: IglooMobile

schemes:
  IglooMobile:
    build:
      targets:
        IglooMobile: all

  IglooMobileUITests:
    build:
      targets:
        IglooMobileUITests: all
        IglooMobile: test
    test:
      targets:
        - IglooMobileUITests
    run:
      config: Debug
