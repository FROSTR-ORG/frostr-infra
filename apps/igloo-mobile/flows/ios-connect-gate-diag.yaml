appId: com.frostr.igloo.dev
name: iOS Connect Gate - Diagnostic

# Focused gate to capture immediate state after btn_connect
# Without waiting for review screen - just capture diagnostic evidence
#
# Runtime credential loading:
#   IGLOO_ONBOARD_DIAGNOSTICS=1 maestro --udid <udid> -p ios \
#     flows/ios-connect-gate-diag.yaml \
#     -e ONBOARD_PACKAGE="$(cat .tmp/test-harness/onboard-bob.txt | tr -d '\r\n')" \
#     -e ONBOARD_PASSWORD="$(cat .tmp/test-harness/onboard-bob.password.txt | tr -d '\r\n')"

---
# Launch
- launchApp:
    appId: com.frostr.igloo.dev
    clearState: false
    clearKeychain: false

- waitForAnimationToEnd

# Navigate to OnboardConnect
- tapOn:
    text: "Onboard Device"

- scrollUntilVisible:
    element:
      id: "btn_connect_entry"
    timeout: 20000

- tapOn:
    id: "btn_connect_entry"

- scrollUntilVisible:
    element:
      id: "input_package"
    timeout: 20000

# Enter relay URL
- tapOn:
    id: "input_relay_url"
- eraseText: 64
- inputText:
    id: "input_relay_url"
    text: "ws://127.0.0.1:8194"

# Enter package via paste button
- tapOn:
    id: "input_package"
- eraseText: 1000
- setClipboard: "${ONBOARD_PACKAGE}"
- tapOn:
    id: "btn_paste_package"
- waitForAnimationToEnd

# Enter password
- scrollUntilVisible:
    element:
      id: "input_password"
    timeout: 10000
- tapOn:
    id: "input_password"
- eraseText: 64
- setClipboard: "${ONBOARD_PASSWORD}"
- pasteText

# Dismiss keyboard and tap Connect
- waitForAnimationToEnd
- tapOn:
    id: "btn_connect"

# IMMEDIATE: capture state right after connect tap (no waiting)
- waitForAnimationToEnd

# Check if btn_connect is still visible (would indicate no state change)
- exists:
    id: "btn_connect"
    timeout: 5000

# Check for loading indicator
- exists:
    id: "btn_connect"
    timeout: 3000

# Check for error banner
- exists:
    id: "onboard_error"
    timeout: 5000

# Check the onboarding step via the screen we're on
# The debug diagnostic panel should be visible since IGLOO_ONBOARD_DIAGNOSTICS=1
# Let's check if we're still on the connect screen
- exists:
    id: "input_package"
    timeout: 5000

# Take a screenshot to see what the UI looks like
# (the screenshot will be in maestro's debug output directory)
- waitForAnimationToEnd

# Report the final state
- assertVisible:
    text: "Connect"