appId: com.frostr.igloo.dev
name: Onboard Device - iOS Debug

# Debug test to capture state after btn_connect
---
- launchApp:
    appId: com.frostr.igloo.dev
    clearState: false
    clearKeychain: false
- waitForAnimationToEnd
- assertVisible:
    text: "Igloo"
- tapOn:
    text: "Onboard Device"
- scrollUntilVisible:
    element:
      id: "btn_connect_entry"
    timeout: 20000
- tapOn:
    id: "btn_connect_entry"
- scrollUntilVisible:
    element:
      id: "input_package"
    timeout: 20000
- assertVisible:
    id: "input_package"
- assertVisible:
    id: "input_password"
- assertVisible:
    id: "btn_connect"

# Enter relay URL
- tapOn:
    id: "input_relay_url"
- eraseText: 64
- inputText:
    id: "input_relay_url"
    text: "ws://127.0.0.1:8194"

# Enter package via paste button
- tapOn:
    id: "input_package"
- eraseText: 1000
- setClipboard: "${ONBOARD_PACKAGE}"
- tapOn:
    id: "btn_paste_package"
- waitForAnimationToEnd

# Enter password via setClipboard + pasteText
- tapOn:
    id: "input_password"
- eraseText: 64
- setClipboard: "${ONBOARD_PASSWORD}"
- pasteText
- waitForAnimationToEnd

# TAP CONNECT AND CAPTURE STATE
- scrollUntilVisible:
    element:
      id: "btn_connect"
    timeout: 10000
- tapOn:
    id: "btn_connect"

# IMMEDIATELY capture state after connect tap
- waitForAnimationToEnd
- waitForAnimationToEnd

# Check what's on screen - look for any indicators of loading or review screen
- scrollUntilVisible:
    element:
      id: "input_device_name"
    timeout: 5000
- assertVisible:
    id: "input_device_name"