appId: com.frostr.igloo.dev
name: Signing Validation - Android

# E2E signing validation flow for Android emulator (AVD rmp_api35).
# Requires runtime-configured relay URL and demo credentials supplied via
# Maestro environment variables (supply via -e when running Maestro).
#
# Run Maestro with credentials via -e flags:
#   maestro --device emulator-5554 test flows/signing-android.yaml \
#     -e ONBOARD_PACKAGE="$(cat .tmp/test-harness/onboard-carol.txt)" \
#     -e ONBOARD_PASSWORD="$(cat .tmp/test-harness/onboard-carol.password.txt)" \
#     -e RELAY_URL="ws://10.0.2.2:8194"
#
# Runtime environment variables:
#   ONBOARD_PACKAGE   - bfonboard1 package string (passed via -e)
#   ONBOARD_PASSWORD  - 32-char password for the demo credential (passed via -e)
#   RELAY_URL         - WebSocket relay URL (passed via -e, default: ws://10.0.2.2:8194 for Android)
#
# Credential loading approach: Maestro 2.6.0 env expansion works in setClipboard,
# so credentials are passed via -e flags and entered via setClipboard + pasteText.
# This avoids hardcoded secrets in the flow file.
# Android relay URL is 10.0.2.2:8194 (special alias for host loopback in emulator).
#
# Flow topology:
#   Hub -> Onboard (if no stored profile) -> Dashboard (Signer tab) ->
#   Wait for signReady -> Test Sign -> Capture result ->
#   Test ECDH -> Capture result -> Clear results -> Back to hub
#
# This flow is self-contained: it onboards carol-Android via the env vars
# (both package and password via setClipboard + pasteText, which supports
# env var expansion in setClipboard), then runs the full signing validation.
# Credentials are supplied via Maestro environment variables (no hardcoded
# secrets in this file).
#
# Android-specific: Android Compose text fields support full clipboard paste,
# unlike iOS TextEditor. Use pressKey back for system-back navigation.
# Android relay URL is 10.0.2.2:8194 (special alias for host loopback in emulator).
#
# Companion verification (VAL-SIGN signature and ECDH):
#   After the flow completes, the captured request IDs, digests, signatures,
#   target pubkeys, and shared secrets can be verified against the demo harness
#   devtools relay log or a local BIP340/ECDH verifier script. The app exposes
#   these values via copyable rows in the Test Sign Result and Test ECDH Result
#   sections; capture them from the UI or clipboard as needed for off-device
#   verification. Example verifier invocation:
#     cargo run -p frostr-utils -- verify-sign <request_id> <digest> <signature> <group_pubkey>
#     cargo run -p frostr-utils -- verify-ecdh <request_id> <target_pubkey> <shared_secret>

---
# Launch and verify app is foregrounded
- launchApp:
    appId: com.frostr.igloo.dev
    clearState: false
    clearKeychain: false

- waitForAnimationToEnd

# Verify hub is visible
- assertVisible:
    text: "Igloo"

# ── Onboard carol-Android if not already present ──────────────────────────
# Navigate: Hub -> OnboardEntry -> OnboardConnect
- tapOn:
    text: "Onboard Device"

- scrollUntilVisible:
    element:
      id: "btn_connect_entry"
    timeout: 20000

- tapOn:
    id: "btn_connect_entry"

- scrollUntilVisible:
    element:
      id: "input_package"
    timeout: 20000

# VAL-ONBOARD-001: Verify connect screen elements
- assertVisible:
    id: "input_package"
- assertVisible:
    id: "input_password"
- assertVisible:
    id: "input_relay_url"
- assertVisible:
    id: "btn_connect"

# Enter relay URL (platform-correct Android emulator value: 10.0.2.2 is host loopback)
- tapOn:
    id: "input_relay_url"
- eraseText: 64
- inputText:
    id: "input_relay_url"
    text: "ws://10.0.2.2:8194"

# Enter package via setClipboard + pasteText
# ONBOARD_PACKAGE is passed via Maestro -e flag (e.g., -e ONBOARD_PACKAGE="$(cat .tmp/test-harness/onboard-carol.txt)").
# Maestro 2.6.0 expands env vars in setClipboard content before writing to clipboard.
- tapOn:
    id: "input_package"
- eraseText: 1000
- setClipboard: "${ONBOARD_PACKAGE}"
- pasteText

# Enter password via setClipboard + pasteText
# ONBOARD_PASSWORD is passed via Maestro -e flag.
- tapOn:
    id: "input_password"
- eraseText: 64
- setClipboard: "${ONBOARD_PASSWORD}"
- pasteText

# Tap Connect
- waitForAnimationToEnd
- tapOn:
    id: "btn_connect"
- waitForAnimationToEnd

# Wait for review screen (180s Rust timeout)
- scrollUntilVisible:
    element:
      id: "input_device_name"
    timeout: 240000

# Review screen: save with device name
- inputText:
    id: "input_device_name"
    text: "carol-Android"
- tapOn:
    id: "btn_save_device"

# Dashboard arrival
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Dashboard"
    timeout: 30000

- assertVisible:
    text: "carol-Android"

# ── Dashboard: navigate to Signer tab ─────────────────────────────────────
- scrollUntilVisible:
    element:
      id: "tab_signer"
    timeout: 10000

- tapOn:
    id: "tab_signer"

- waitForAnimationToEnd

# VAL-SIGN-001: Verify the Signer tab is active
- assertVisible:
    text: "Signer"
- assertVisible:
    id: "signer_status_card"

# VAL-SIGN-007: Verify the pending operations section is visible
- assertVisible:
    id: "pending_ops_empty"

# Start the signer
- scrollUntilVisible:
    element:
      id: "btn_start_signer"
    timeout: 10000

- tapOn:
    id: "btn_start_signer"

# Wait for alice sign-ready state (VAL-SIGN-001, VAL-SIGN-003)
- scrollUntilVisible:
    element:
      text: "Sign Ready"
    timeout: 60000

# Also verify the relay is connected
- assertVisible:
    text: "Relay: Connected"

# VAL-SIGN-003: Verify alice peer is shown as ready
- scrollUntilVisible:
    element:
      id: "peer_alice"
    timeout: 15000

- assertVisible:
    id: "peer_alice"

# VAL-SIGN-002: Run Test Sign operation
- scrollUntilVisible:
    element:
      id: "btn_test_sign"
    timeout: 10000

- tapOn:
    id: "btn_test_sign"

# VAL-SIGN-007: Observe pending operation indicator while sign is in flight
- waitForAnimationToEnd

# Wait for the test sign result section to appear (VAL-SIGN-006)
- scrollUntilVisible:
    element:
      id: "test_sign_result_section"
    timeout: 60000

# VAL-SIGN-006: Capture request id, digest, and signature evidence
- assertVisible:
    id: "test_sign_request_id"
- assertVisible:
    id: "test_sign_digest"
- assertVisible:
    id: "test_sign_signature"

# Copy the request id to clipboard for correlation with demo-harness logs
- tapOn:
    id: "test_sign_request_id_copy"

# VAL-SIGN-007: Verify pending operation clears after signing completes
- scrollUntilVisible:
    element:
      id: "pending_ops_empty"
    timeout: 30000

# VAL-SIGN-005: Run Test ECDH operation
- scrollUntilVisible:
    element:
      id: "btn_test_ecdh"
    timeout: 10000

- tapOn:
    id: "btn_test_ecdh"

# Wait for the test ECDH result section to appear
- scrollUntilVisible:
    element:
      id: "test_ecdh_result_section"
    timeout: 60000

# VAL-SIGN-006: Capture request id, target pubkey, and shared secret evidence
- assertVisible:
    id: "test_ecdh_request_id"
- assertVisible:
    id: "test_ecdh_target_pubkey"
- assertVisible:
    id: "test_ecdh_shared_secret"

# Copy the request id to clipboard for correlation
- tapOn:
    id: "test_ecdh_request_id_copy"

# VAL-SIGN-008: Verify the result section reflects non-empty values
- assertVisible:
    id: "test_sign_result_section"

# Clear test sign result
- scrollUntilVisible:
    element:
      id: "btn_clear_test_sign_result"
    timeout: 10000

- tapOn:
    id: "btn_clear_test_sign_result"

- waitForAnimationToEnd

# Clear test ECDH result
- scrollUntilVisible:
    element:
      id: "btn_clear_test_ecdh_result"
    timeout: 10000

- tapOn:
    id: "btn_clear_test_ecdh_result"

- waitForAnimationToEnd

# VAL-SIGN-009: Navigate back to hub using Android system-back
- scrollUntilVisible:
    element:
      id: "btn_back_dashboard"
    timeout: 10000

- tapOn:
    id: "btn_back_dashboard"

- waitForAnimationToEnd

# Verify back at hub with the profile listed
- assertVisible:
    text: "Igloo"

- scrollUntilVisible:
    element:
      text: "carol-Android"
    timeout: 10000

- assertVisible:
    text: "carol-Android"

# End of signing validation flow.
#
# Companion verification steps (run manually or via devtools script):
#  1. Correlate captured request IDs with relay/event log entries
#  2. Verify signature against group public key using BIP340
#  3. Verify shared secret derivation using ECDH with captured target pubkey
#  4. Confirm no hardcoded secrets appear in any Maestro output or screenshots