appId: com.frostr.igloo.dev
name: Onboard Quick Check - iOS

env:
  BOB_PACKAGE: ""
  BOB_PASSWORD: "${BOB_PASSWORD:-changeme}"

---
# Launch app
- launchApp:
    appId: com.frostr.igloo.dev
    clearState: false
    clearKeychain: false

- waitForAnimationToEnd

# Navigate to OnboardConnect
- tapOn:
    text: "Onboard Device"
- scrollUntilVisible:
    element:
      id: "btn_connect_entry"
- tapOn:
    id: "btn_connect_entry"
- scrollUntilVisible:
    element:
      id: "input_package"

# Fill in credentials
- tapOn:
    id: "input_package"
- eraseText: 1000
- setClipboard: "${BOB_PACKAGE}"
- pasteText

- tapOn:
    id: "input_password"
- eraseText: 64
- setClipboard: "${BOB_PASSWORD}"
- pasteText

- tapOn:
    id: "input_relay_url"
- eraseText: 64
- inputText:
    id: "input_relay_url"
    text: "ws://127.0.0.1:8194"

# Tap Connect
- tapOn:
    id: "btn_connect"

# Wait 30 seconds for handshake to complete
- waitForAnimationToEnd

# Check multiple possible screens - what do we see?
- scrollUntilVisible:
    element:
      id: "input_device_name"
    timeout: 30000