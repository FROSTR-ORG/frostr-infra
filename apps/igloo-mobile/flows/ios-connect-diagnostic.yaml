appId: com.frostr.igloo.dev
name: Onboard Connect Diagnostic Matrix - iOS (prelaunched app)

# Captures the redacted diagnostic matrix for the Swift dispatch/observation hang.
#
# Runtime credential loading via Maestro -e flags:
#   maestro --device iPhone-15-Pro test flows/ios-connect-diagnostic.yaml \
#     -e ONBOARD_PACKAGE="$(cat .tmp/test-harness/onboard-bob.txt | tr -d '\r\n')" \
#     -e ONBOARD_PASSWORD="$(cat .tmp/test-harness/onboard-bob.password.txt | tr -d '\r\n')" \
#     -e RELAY_URL="ws://127.0.0.1:8194"
#
# IMPORTANT: This flow assumes the app is ALREADY running (prelaunched via
# xcrun simctl launch with SIMCTL_CHILD_IGLOO_ONBOARD_DIAGNOSTICS=1).
# Do NOT use launchApp in this flow.
#
# The diagnostic panel (debug_onboard_diagnostics) is visible on OnboardConnect
# BEFORE btn_connect when IGLOO_ONBOARD_DIAGNOSTICS=1 is set. The panel captures:
# - Swift Button action entry timing
# - onboardConnect dispatch timing and returned state
# - manager.state assignment timing
# - isOnboardingLoading after assignment
# - FullState and PerformOnboardHandshake callback counts
# - Task.detached scheduling and rust.onboard timing
#
# Credentials passed via Maestro environment variables (no hardcoded secrets).
# Package set to Maestro clipboard before paste button; password via setClipboard + pasteText.

---
# Step 1: Verify app is already running and hub is visible (no launchApp)
# The app needs time to initialize the Rust core after launch. The scroll command
# acts as a wait for "Igloo" to appear (60s timeout). On a cold start, the onboarding
# hub may take 15-25s to render after the app binary and Rust core load.
- scrollUntilVisible:
    element:
      text: "Igloo"
    timeout: 60000
- waitForAnimationToEnd
- assertVisible:
    text: "Igloo"
- assertVisible:
    text: "Onboard Device"

# Step 2: Navigate: Hub -> OnboardEntry -> OnboardConnect
- tapOn:
    text: "Onboard Device"

- scrollUntilVisible:
    element:
      id: "btn_connect_entry"
    timeout: 20000
- tapOn:
    id: "btn_connect_entry"

- scrollUntilVisible:
    element:
      id: "input_package"
    timeout: 20000

# Step 3: Verify connect screen elements are present
# The debug_onboard_diagnostics panel is rendered only when isOnboardingLoading
# (derived from state.onboarding.step being Decrypting/Review). At this pre-submit
# point the step is still Idle, so the panel is not in the view hierarchy yet.
# The panel reading happens in Step 8 (post-connect) when the step is Decrypting.
- assertVisible:
    id: "input_package"
- assertVisible:
    id: "input_password"
- assertVisible:
    id: "input_relay_url"
- assertVisible:
    id: "btn_connect"

# Step 4: Enter relay URL (platform-correct iOS Simulator value)
- tapOn:
    id: "input_relay_url"
- eraseText: 64
- inputText:
    id: "input_relay_url"
    text: "ws://127.0.0.1:8194"

# Step 5: Enter package via clipboard paste (bypasses TextEditor ~86-char Maestro paste limit).
# Uses setClipboard + btn_paste_package button which reads UIPasteboard.general.string.
# The package is ~690 chars of bech32m text, too long for Maestro's direct paste.
- tapOn:
    id: "input_package"
- eraseText: 1000
- setClipboard: "${ONBOARD_PACKAGE}"
- tapOn:
    id: "btn_paste_package"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "input_password"
    timeout: 10000

# Step 6: Enter password via setClipboard + pasteText
- tapOn:
    id: "input_password"
- eraseText: 64
- setClipboard: "${ONBOARD_PASSWORD}"
- pasteText
- waitForAnimationToEnd

# Step 7: Dismiss keyboard
- waitForAnimationToEnd

# Step 8: Wait for SwiftUI state to sync after password paste before reading diagnostics.
# After step 7's waitForAnimationToEnd, SwiftUI should have re-rendered the button
# as enabled (canSubmit = true when packageText and passwordText are non-empty).
# Adding an additional wait ensures the paste state has fully propagated to SwiftUI.
- waitForAnimationToEnd

# Step 9: Tap Connect with credentials filled.
# The tap fires the onboardConnect() action synchronously. performOnboardHandshake
# is called immediately after dispatch (not via async reconciler callback). The
# button action fires regardless of .disabled() state — the action body checks
# canSubmit but the closure executes on tap. Since step 8 ensured state is synced,
# canSubmit should be true and performOnboardHandshake is invoked.
# The tap completes as soon as the synchronous button action fires. The Rust async
# handshake continues off-thread while Maestro waits for the next assertion.
- tapOn:
    id: "btn_connect"

# Step 10: Wait for the Rust async handshake to complete and UI to update.
# The state transitions to Decrypting immediately on dispatch (canSubmit becomes
# false, button shows "Connecting..."). The rust.onboard() runs in a dedicated
# thread with 200s outer timeout (8d67417: tokio::time::timeout wrapping block_on
# + catch_unwind). When it returns (success or error), Swift dispatches the result
# and the UI transitions to OnboardReview (success) or OnboardConnect with error
# (failure within timeout). The waitForAnimationToEnd gives SwiftUI time to render
# the transition before step 11's assertion.
- waitForAnimationToEnd
- waitForAnimationToEnd

# Step 11: Wait for review screen (200s Rust timeout + Swift 190s safety net).
# If rust.onboard succeeds: OnboardReview with input_device_name appears (success).
# If rust.onboard fails or times out: OnboardConnect with onboard_error appears.
# scrollUntilVisible waits for input_device_name — if rust.onboard returns an error
# within the timeout, the element won't appear and Maestro's 240s timeout fires.
- scrollUntilVisible:
    element:
      id: "input_device_name"
    timeout: 240000

# Step 12: Capture review screen elements as evidence of successful transition.
# VAL-ONBOARD-008: Key values are visible and accessible on the review screen.
- assertVisible:
    id: "input_device_name"
- assertVisible:
    id: "display_share_pubkey"
- assertVisible:
    id: "display_group_pubkey"
- assertVisible:
    id: "btn_save_device"