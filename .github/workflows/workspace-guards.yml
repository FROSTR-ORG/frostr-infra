name: workspace-guards

on:
  pull_request:
    paths:
      - ".github/workflows/workspace-guards.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "Makefile"
      - "docs/**"
      - "dev/**"
      - "test/**"
      - "scripts/**"
      - ".gitmodules"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/workspace-guards.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "Makefile"
      - "docs/**"
      - "dev/**"
      - "test/**"
      - "scripts/**"
      - ".gitmodules"

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json

      # dtolnay/rust-toolchain has no semver tag for `stable`; pin to the
      # current HEAD of the `stable` branch. Refresh periodically (dependabot
      # or manual bump) to pick up new toolchain releases.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2 (v2.9.1)

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            ripgrep

      - name: Install wasm-pack
        run: cargo install --locked --version 0.14.0 wasm-pack

      - name: Install test dependencies
        working-directory: test
        run: npm install

      - name: Run workspace guards
        working-directory: test
        run: npm run test:guards

      - name: Run dry affected check
        run: FROSTR_AFFECTED_DRY_RUN=1 FROSTR_AFFECTED_FILES='' make test-affected
