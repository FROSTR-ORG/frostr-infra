name: client-scoped-validation

on:
  pull_request:
    paths:
      - ".github/workflows/client-scoped-validation.yml"
      - ".gitmodules"
      - "scripts/**"
      - "test/**"
      - "repos/igloo-pwa"
      - "repos/igloo-chrome"
      - "repos/igloo-home"
      - "repos/igloo-shared"
      - "repos/igloo-ui"
      - "repos/bifrost-rs"
      - "repos/igloo-shell"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/client-scoped-validation.yml"
      - ".gitmodules"
      - "scripts/**"
      - "test/**"
      - "repos/igloo-pwa"
      - "repos/igloo-chrome"
      - "repos/igloo-home"
      - "repos/igloo-shared"
      - "repos/igloo-ui"
      - "repos/bifrost-rs"

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Initialize PWA submodules
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init repos/bifrost-rs repos/igloo-shared repos/igloo-ui repos/igloo-pwa

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            test/package-lock.json
            repos/igloo-shared/package-lock.json
            repos/igloo-ui/package-lock.json
            repos/igloo-pwa/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang ripgrep
          cargo install --locked --version 0.14.0 wasm-pack
          npm ci --prefix repos/igloo-shared
          npm ci --prefix repos/igloo-ui
          npm ci --prefix repos/igloo-pwa
          npm ci --prefix test
          npx --prefix test playwright install chromium --with-deps
          cargo fetch --manifest-path repos/bifrost-rs/Cargo.toml --locked --target wasm32-unknown-unknown

      - name: Run PWA scoped validation
        run: |
          bash scripts/test-prebuild.sh ensure pwa-runtime
          npm --prefix test run test:guards:pwa
          npm --prefix test run test:typecheck:pwa
          npm --prefix repos/igloo-shared run test:unit
          npm --prefix repos/igloo-pwa run test:unit:raw
          cargo test --lib --workspace --manifest-path repos/bifrost-rs/Cargo.toml --locked
          npm --prefix test run test:e2e:igloo-pwa:fast
          npm --prefix test run test:e2e:igloo-pwa:smoke

  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Initialize Chrome submodules
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init repos/bifrost-rs repos/igloo-shared repos/igloo-ui repos/igloo-chrome

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            test/package-lock.json
            repos/igloo-shared/package-lock.json
            repos/igloo-ui/package-lock.json
            repos/igloo-chrome/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang ripgrep
          cargo install --locked --version 0.14.0 wasm-pack
          npm ci --prefix repos/igloo-shared
          npm ci --prefix repos/igloo-ui
          npm ci --prefix repos/igloo-chrome
          npm ci --prefix test
          npx --prefix test playwright install chromium --with-deps
          npm audit --prefix repos/igloo-chrome --audit-level=moderate
          cargo fetch --manifest-path repos/bifrost-rs/Cargo.toml --locked --target wasm32-unknown-unknown

      - name: Run Chrome scoped validation
        run: |
          bash scripts/test-prebuild.sh ensure chrome-runtime
          npm --prefix test run test:guards:chrome
          npm --prefix test run test:typecheck:chrome
          npm --prefix repos/igloo-chrome run test:unit:raw
          npm --prefix repos/igloo-chrome run build:app
          cargo test --lib --workspace --manifest-path repos/bifrost-rs/Cargo.toml --locked
          npm --prefix test run test:e2e:igloo-chrome:fast
          npm --prefix test run test:e2e:igloo-chrome:smoke

  home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Initialize Home submodules
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init repos/igloo-shared repos/igloo-ui repos/igloo-home

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            test/package-lock.json
            repos/igloo-shared/package-lock.json
            repos/igloo-ui/package-lock.json
            repos/igloo-home/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          npm ci --prefix repos/igloo-shared
          npm ci --prefix repos/igloo-ui
          npm ci --prefix repos/igloo-home
          npm ci --prefix test

      - name: Run Home scoped validation
        run: |
          npm --prefix test run test:guards:home
          npm --prefix test run test:typecheck:home
          npm --prefix repos/igloo-home run test:unit

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # igloo-shell path-depends on bifrost-rs crates (../../../bifrost-rs), so
      # both must be present to compile its lib tests.
      - name: Initialize Shell submodules
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init repos/bifrost-rs repos/igloo-shell

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang
          cargo fetch --manifest-path repos/igloo-shell/Cargo.toml --locked

      - name: Run Shell scoped validation
        run: |
          cargo test --lib --workspace --manifest-path repos/igloo-shell/Cargo.toml --locked
