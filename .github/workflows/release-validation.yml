name: release-validation

on:
  pull_request:
    paths:
      - ".github/workflows/release-validation.yml"
      - ".gitmodules"
      - "Makefile"
      - "compose.test.yml"
      - "scripts/**"
      - "services/**"
      - "test/**"
      - "repos/bifrost-rs"
      - "repos/igloo-chrome"
      - "repos/igloo-home"
      - "repos/igloo-pwa"
      - "repos/igloo-shared"
      - "repos/igloo-shell"
      - "repos/igloo-ui"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-validation.yml"
      - ".gitmodules"
      - "Makefile"
      - "compose.test.yml"
      - "scripts/**"
      - "services/**"
      - "test/**"
      - "repos/bifrost-rs"
      - "repos/igloo-chrome"
      - "repos/igloo-home"
      - "repos/igloo-pwa"
      - "repos/igloo-shared"
      - "repos/igloo-shell"
      - "repos/igloo-ui"

jobs:
  demo-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            test/package-lock.json
            repos/igloo-ui/package-lock.json
            repos/igloo-shared/package-lock.json
            repos/igloo-pwa/package-lock.json
            repos/igloo-chrome/package-lock.json
            repos/igloo-home/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            wget \
            xvfb

      - name: Install wasm-pack
        run: cargo install --locked --version 0.14.0 wasm-pack

      - name: Install workspace npm dependencies
        run: |
          npm ci --prefix repos/igloo-ui
          npm ci --prefix repos/igloo-shared
          npm ci --prefix repos/igloo-pwa
          npm ci --prefix repos/igloo-chrome
          npm ci --prefix repos/igloo-home
          npm ci --prefix test

      - name: Fetch Rust dependencies for offline builds
        run: |
          cargo fetch --manifest-path repos/bifrost-rs/Cargo.toml --locked --target wasm32-unknown-unknown
          cargo fetch --manifest-path repos/igloo-shell/Cargo.toml --locked
          cargo fetch --manifest-path repos/igloo-home/src-tauri/Cargo.toml --locked

      # Fast, clear gate: catch bifrost-rs <-> igloo-shell API drift (path deps)
      # before the slower in-Docker demo build.
      - name: Check pinned submodule pair compiles
        run: make demo-pair-check

      - name: Install Playwright browsers
        run: npm --prefix test run test:install-browsers

      # docker-container builder enables the type=gha BuildKit cache used by the
      # demo image build (via compose.ci.yml + COMPOSE_BAKE below).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run required demo validation
        env:
          COMPOSE_BAKE: "true"
          FROSTR_DEMO_COMPOSE_OVERRIDE: compose.ci.yml
        run: xvfb-run -a make test-demo
