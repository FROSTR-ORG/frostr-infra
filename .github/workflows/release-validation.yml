name: release-validation

on:
  pull_request:
    paths:
      - ".github/workflows/release-validation.yml"
      - ".gitmodules"
      - "Makefile"
      - "compose.test.yml"
      - "scripts/**"
      - "services/**"
      - "test/**"
      - "repos/bifrost-rs"
      - "repos/igloo-chrome"
      - "repos/igloo-home"
      - "repos/igloo-pwa"
      - "repos/igloo-shared"
      - "repos/igloo-shell"
      - "repos/igloo-ui"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/release-validation.yml"
      - ".gitmodules"
      - "Makefile"
      - "compose.test.yml"
      - "scripts/**"
      - "services/**"
      - "test/**"
      - "repos/bifrost-rs"
      - "repos/igloo-chrome"
      - "repos/igloo-home"
      - "repos/igloo-pwa"
      - "repos/igloo-shared"
      - "repos/igloo-shell"
      - "repos/igloo-ui"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  demo-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            test/package-lock.json
            repos/igloo-ui/package-lock.json
            repos/igloo-shared/package-lock.json
            repos/igloo-pwa/package-lock.json
            repos/igloo-chrome/package-lock.json
            repos/igloo-home/package-lock.json

      # dtolnay/rust-toolchain has no semver tag for `stable`; pin to the
      # current HEAD of the `stable` branch. Refresh periodically (dependabot
      # or manual bump) to pick up new toolchain releases.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2 (v2.9.1)

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            wget \
            xvfb

      - name: Install wasm-pack
        run: cargo install --locked --version 0.14.0 wasm-pack

      - name: Install workspace npm dependencies
        run: |
          npm ci --prefix repos/igloo-ui
          npm ci --prefix repos/igloo-shared
          npm ci --prefix repos/igloo-pwa
          npm ci --prefix repos/igloo-chrome
          npm ci --prefix repos/igloo-home
          npm ci --prefix test

      - name: Fetch Rust dependencies for offline builds
        run: |
          cargo fetch --manifest-path repos/bifrost-rs/Cargo.toml --locked --target wasm32-unknown-unknown
          cargo fetch --manifest-path repos/igloo-shell/Cargo.toml --locked
          cargo fetch --manifest-path repos/igloo-home/src-tauri/Cargo.toml --locked

      # Fast, clear gate: catch bifrost-rs <-> igloo-shell API drift (path deps)
      # before the slower in-Docker demo build.
      - name: Check pinned submodule pair compiles
        run: make demo-pair-check

      - name: Install Playwright browsers
        run: npm --prefix test run test:install-browsers

      # docker-container builder enables the type=gha BuildKit cache used by the
      # demo image build (via compose.ci.yml + COMPOSE_BAKE below).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run required demo validation
        env:
          COMPOSE_BAKE: "true"
          FROSTR_DEMO_COMPOSE_OVERRIDE: compose.ci.yml
        run: xvfb-run -a make test-demo

      # Gate the @live lane (igloo-pwa:live + igloo-chrome:live). It previously
      # ran nowhere in CI, which let several post-merge regressions land
      # undetected (WASM integrity loaders, the security profile-unlock
      # contract, and Paper-redesign UI drift). Runs after the demo gate so it
      # reuses the same toolchain, Docker Buildx, and browser setup.
      - name: Run live e2e lane
        env:
          COMPOSE_BAKE: "true"
          FROSTR_DEMO_COMPOSE_OVERRIDE: compose.ci.yml
        run: xvfb-run -a make test-live
